<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NariAdhikar | Emergency Contacts</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        .contacts-page {
            min-height: 100vh;
            background: #fff8fc;
            padding-bottom: 60px;
        }

        .contacts-hero {
            text-align: center;
            padding: 60px 20px 40px;

            background:
                linear-gradient(
                    135deg,
                    #fff0f7,
                    #f5eaff
                );
        }

        .contacts-hero h1 {
            color: #54245f;
            font-size: 42px;
            margin-bottom: 12px;
        }

        .contacts-hero p {
            color: #666;
            font-size: 17px;
        }

        .contact-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .contact-box {
            background: white;
            padding: 35px;
            border-radius: 20px;

            box-shadow:
                0 10px 30px
                rgba(70,30,80,.10);
        }

        .contact-box h2 {
            color: #54245f;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #54245f;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;
        }

        .save-contact-btn {
            background: #b83280;
            color: white;

            border: none;
            border-radius: 25px;

            padding: 13px 25px;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
        }

        .save-contact-btn:hover {
            background: #54245f;
        }

        .saved-contacts {
            margin-top: 35px;
        }

        .saved-contacts h2 {
            color: #54245f;
            margin-bottom: 20px;
        }

        .contact-card {
            background: white;
            padding: 20px;

            border-radius: 15px;

            border: 1px solid #eadfe9;

            margin-bottom: 15px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
        }

        .contact-info h3 {
            color: #54245f;
            margin-bottom: 5px;
        }

        .contact-info p {
            color: #666;
            margin: 4px 0;
        }

        .contact-buttons {
            display: flex;
            gap: 8px;
        }

        .call-contact-btn {
            background: #238636;
            color: white;

            text-decoration: none;

            padding: 9px 15px;

            border-radius: 8px;

            font-weight: 600;
        }

        .delete-contact-btn {
            background: #c62828;
            color: white;

            border: none;

            padding: 9px 15px;

            border-radius: 8px;

            cursor: pointer;
        }

        .back-emergency {
            display: inline-block;

            margin-top: 25px;

            text-decoration: none;

            color: #54245f;

            font-weight: 600;
        }

        .logout-btn {
            background: #54245f;
            color: white;

            border: none;

            padding: 10px 18px;

            border-radius: 20px;

            cursor: pointer;

            float: right;
        }

        .no-contact {
            color: #777;
            text-align: center;
            padding: 20px;
        }

        @media(max-width: 600px) {

            .contacts-hero h1 {
                font-size: 32px;
            }

            .contact-box {
                padding: 25px 20px;
            }

            .contact-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .contact-buttons {
                width: 100%;
            }

            .call-contact-btn,
            .delete-contact-btn {
                flex: 1;
                text-align: center;
            }

        }

    </style>

</head>


<body class="contacts-page">


<!-- =========================================
     HEADER
========================================= -->

<header class="main-header">

    <nav class="main-nav">

        <a href="index.html" class="logo">
            🌸 NariAdhikar
        </a>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="legal-rights.html">
                Legal Rights
            </a>

            <a href="women-care.html">
                Women Care
            </a>

            <a href="awareness.html">
                Awareness
            </a>

            <a href="rural-safety.html">
                Rural Safety
            </a>

            <a href="career.html">
                Career
            </a>

            <a href="emergency.html" class="active">
                Emergency
            </a>

        </div>

    </nav>

</header>



<!-- =========================================
     HERO
========================================= -->

<section class="contacts-hero">

    <h1>
        👨‍👩‍👧 My Emergency Contacts
    </h1>

    <p>
        Add parents, family members or trusted
        people for quick emergency access.
    </p>

</section>



<!-- =========================================
     CONTACT CONTAINER
========================================= -->

<div class="contact-container">


    <button
        class="logout-btn"
        onclick="logoutUser()">

        Logout

    </button>


    <!-- ADD CONTACT -->

    <div class="contact-box">

        <h2>
            💗 Add Trusted Contact
        </h2>


        <div class="form-group">

            <label for="contactName">
                Contact Name
            </label>

            <input
                type="text"
                id="contactName"
                placeholder="Example: Mother">

        </div>


        <div class="form-group">

            <label for="relationship">
                Relationship
            </label>

            <select id="relationship">

                <option value="">
                    Select relationship
                </option>

                <option value="Mother">
                    Mother
                </option>

                <option value="Father">
                    Father
                </option>

                <option value="Brother">
                    Brother
                </option>

                <option value="Sister">
                    Sister
                </option>

                <option value="Friend">
                    Friend
                </option>

                <option value="Relative">
                    Relative
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="contactPhone">
                Phone Number
            </label>

            <input
                type="tel"
                id="contactPhone"
                placeholder="Enter phone number"
                maxlength="10">

        </div>


        <button
            class="save-contact-btn"
            onclick="saveEmergencyContact()">

            💾 Save Contact

        </button>

    </div>



    <!-- SAVED CONTACTS -->

    <div class="saved-contacts">

        <h2>
            📞 Your Saved Contacts
        </h2>

        <div id="contactsList">

            <div class="no-contact">
                No emergency contacts added yet.
            </div>

        </div>

    </div>


    <a
        href="emergency.html"
        class="back-emergency">

        ← Back to Emergency Page

    </a>

</div>



<!-- JAVASCRIPT -->

<script src="js/emergency-contacts.js"></script>

</body>

</html>
